sit)</span><b>${money(deposit)}</b></div></div>`:''}</div><div class="drawer-foot">${items.length?`<button class="btn btn-primary" style="width:100%" data-action="checkout">Reserve for ${money(deposit)}</button><p class="inline-note" style="text-align:center;margin-bottom:0">Demo only — no card will be charged.</p>`:'<button class="btn btn-secondary" style="width:100%" data-action="close-cart">Keep browsing</button>'}</div></aside>`;

  function render(){
    state=load(); let route=location.hash.replace('#/','').split('?')[0]||''; let html='';
    if(route==='dashboard')html=dashboard(); else if(route==='bookings')html=bookings(); else if(route==='inventory')html=inventory(); else if(route==='customers')html=customers(); else if(route==='calendar')html=calendar(); else if(route==='settings')html=settings(); else if(route==='store')html=store(); else if(route==='confirm'){const b=JSON.parse(sessionStorage.getItem('bj.confirm')||'null'); html=b?confirmationPage(b):store();} else html=marketing();
    $('#app').innerHTML=html; bind(); window.scrollTo({top:0});
  }

  function showModal(type,data){document.body.insertAdjacentHTML('beforeend',modal(type,data));bindModal();}
  function closeModal(){$('.modal-backdrop')?.remove();}
  function openCart(){ if($('.drawer'))return; document.body.insertAdjacentHTML('beforeend',cartDrawer()); bindCart(); }
  function closeCart(){$('.drawer')?.remove();$('.drawer-backdrop')?.remove();}
  function refreshCart(){closeCart();openCart();renderStoreCount();}
  function renderStoreCount(){const c=$('.cart-count');if(c)c.textContent=load().cart.reduce((s,x)=>s+x.qty,0);}

  function bind(){
    $$('[data-action="new-booking"]').forEach(b=>b.onclick=()=>showModal('booking'));
    $$('[data-action="new-item"]').forEach(b=>b.onclick=()=>showModal('item'));
    $$('[data-edit-item]').forEach(b=>b.onclick=()=>showModal('item',state.inventory.find(i=>i.id===b.dataset.editItem)||{}));
    $$('[data-delete-item]').forEach(b=>b.onclick=()=>{if(!window.confirm('Delete this inventory item?'))return;state.inventory=state.inventory.filter(i=>i.id!==b.dataset.deleteItem);save('inventory',state.inventory);render();toast('Item deleted');});
    $('#inventorySearch')?.addEventListener('input',e=>$$('.item-card').forEach(c=>c.classList.toggle('hidden',!c.dataset.name.includes(e.target.value.toLowerCase()))));
    $$('[data-booking-status]').forEach(b=>b.onclick=()=>{const x=state.bookings.find(v=>v.id===b.dataset.bookingStatus);if(x){x.status=x.status==='pending'?'confirmed':x.status==='confirmed'?'cancelled':'pending';save('bookings',state.bookings);render();}});
    const bookingSearch=$('#bookingSearch'), bookingFilter=$('#bookingFilter'); const filterBookings=()=>{if(!bookingSearch)return; const q=bookingSearch.value.toLowerCase(),f=bookingFilter.value; $$('#bookingRows tr').forEach(r=>{const txt=r.textContent.toLowerCase();r.classList.toggle('hidden',!(txt.includes(q)&&(f==='all'||txt.includes(f))));});}; bookingSearch?.addEventListener('input',filterBookings);bookingFilter?.addEventListener('change',filterBookings);
    $$('[data-setting-toggle]').forEach(t=>t.onclick=()=>{state.settings[t.dataset.settingToggle]=!state.settings[t.dataset.settingToggle];save('settings',state.settings);t.classList.toggle('on');});
    $('#settingsForm')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);['business','email','phone','city'].forEach(k=>state.settings[k]=f.get(k));['deposit','fee','delivery'].forEach(k=>state.settings[k]=Number(f.get(k)||0));save('settings',state.settings);toast('Settings saved');render();});
    $('[data-action="connect-payments"]')?.addEventListener('click',()=>toast('Stripe Connect is intentionally disabled in demo mode.'));
    $$('[data-category]').forEach(c=>c.onclick=()=>{$$('[data-category]').forEach(x=>x.classList.remove('active'));c.classList.add('active');const cat=c.dataset.category;$$('.product').forEach(p=>p.classList.toggle('hidden',cat!=='All'&&p.dataset.category!==cat));});
    $$('[data-add-cart]').forEach(b=>b.onclick=()=>{state=load();const x=state.cart.find(c=>c.id===b.dataset.addCart);const inv=state.inventory.find(i=>i.id===b.dataset.addCart);if(x){if(x.qty<inv.qty)x.qty++;else return toast('That is the max available quantity.');}else state.cart.push({id:b.dataset.addCart,qty:1});save('cart',state.cart);renderStoreCount();toast('Added to cart');});
    $('[data-action="cart"]')?.addEventListener('click',openCart);
  }

  function bindModal(){
    $$('[data-close-modal]').forEach(b=>b.onclick=closeModal);$('.modal-backdrop')?.addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
    $('#itemForm')?.addEventListener('submit',e=>{e.preventDefault();state=load();const f=new FormData(e.target),id=e.target.dataset.id;const val={id:id||uid('inv'),name:f.get('name'),category:f.get('category'),emoji:f.get('emoji')||'🎉',price:Number(f.get('price')),qty:Number(f.get('qty')),desc:f.get('desc'),active:true};if(id){state.inventory=state.inventory.map(i=>i.id===id?val:i);}else state.inventory.unshift(val);save('inventory',state.inventory);closeModal();render();toast('Inventory saved');});
    $('#bookingForm')?.addEventListener('submit',e=>{e.preventDefault();state=load();const f=new FormData(e.target);const b={id:`BJ-${Math.floor(1100+Math.random()*8000)}`,customer:f.get('customer'),email:f.get('email'),date:f.get('date'),total:Number(f.get('total')),status:'confirmed',items:[f.get('items')],address:'Manual booking'};state.bookings.unshift(b);upsertCustomer(b.customer,b.email,'',b.total);save('bookings',state.bookings);closeModal();render();toast('Booking created');});
  }
  function bindCart(){
    $$('[data-action="close-cart"]').forEach(b=>b.onclick=closeCart);
    $$('[data-cart-inc]').forEach(b=>b.onclick=()=>{state=load();const c=state.cart.find(x=>x.id===b.dataset.cartInc),inv=state.inventory.find(i=>i.id===c.id);if(c.qty<inv.qty){c.qty++;save('cart',state.cart);refreshCart();}else toast('No more units available.');});
    $$('[data-cart-dec]').forEach(b=>b.onclick=()=>{state=load();const c=state.cart.find(x=>x.id===b.dataset.cartDec);c.qty--;state.cart=state.cart.filter(x=>x.qty>0);save('cart',state.cart);refreshCart();});
    $('[data-action="checkout"]')?.addEventListener('click',()=>{const form=$('#checkoutForm');if(!form.reportValidity())return;state=load();const f=new FormData(form);const items=state.cart.map(c=>{const p=state.inventory.find(i=>i.id===c.id);return {...p,cartQty:c.qty}});const subtotal=items.reduce((s,i)=>s+i.price*i.cartQty,0),delivery=Number(state.settings.delivery||0),fee=(subtotal+delivery)*(Number(state.settings.fee||0)/100),total=subtotal+delivery+fee;const b={id:`BJ-${Math.floor(2000+Math.random()*7000)}`,customer:f.get('name'),email:f.get('email'),phone:f.get('phone'),date:f.get('date'),time:f.get('time'),total:Number(total.toFixed(2)),status:state.settings.autoConfirm?'confirmed':'pending',items:items.map(i=>`${i.name}${i.cartQty>1?` ×${i.cartQty}`:''}`),address:f.get('address'),waiverAccepted:true,createdAt:new Date().toISOString()};state.bookings.unshift(b);save('bookings',state.bookings);upsertCustomer(b.customer,b.email,b.phone,b.total);save('cart',[]);sessionStorage.setItem('bj.confirm',JSON.stringify(b));closeCart();location.hash='#/confirm';});
  }
  function upsertCustomer(name,email,phone,amount){const customers=JSON.parse(localStorage.getItem('bj.customers')||'[]');let c=customers.find(x=>x.email.toLowerCase()===String(email).toLowerCase());if(c){c.bookings+=1;c.spent=Number((c.spent+Number(amount||0)).toFixed(2));if(phone)c.phone=phone;}else customers.unshift({id:uid('c'),name,email,phone,bookings:1,spent:Number(amount||0)});save('customers',customers);state.customers=customers;}

  window.addEventListener('hashchange',render); render();
})();

</script>
</body>
</html>
